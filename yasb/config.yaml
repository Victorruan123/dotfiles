watch_stylesheet: true
watch_config: true
debug: false

bars:
  floating-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      center: false
    blur_effect:
      enabled: false
      acrylic: false
      dark_mode: true
      round_corners: true
      border_color: None
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 36
    padding:
      top: 8
      left: 10
      bottom: 0
      right: 10
    widgets:
      left: ["active_window"]
      center: ["clock"]
      right: ["cpu", "cpu_temp", "memory"]

widgets:
  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "{win[process][name]}"
      label_no_window: ""
      label_icon: true
      label_icon_size: 18
      max_length: 40
      max_length_ellipsis: "..."
      monitor_exclusive: true

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M  %a, %b %d}"
      label_alt: "{%A, %d %B %Y}"
      update_interval: 1000

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title} - {artist}"
      label_alt: "{title}"
      max_field_size:
        label: 32
        label_alt: 32
      show_thumbnail: false
      hide_empty: true

  weather:
    type: "yasb.weather.WeatherWidget"
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "{location}: min {min_temp}, max {max_temp}, umidade {humidity}"
      api_key: "env"
      location: "Jardim, Ceara, Brazil"
      units: "metric"
      hide_decimal: true
      show_alerts: false
      update_interval: 600
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      weather_card:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "None"
        alignment: "right"
        direction: "down"
        icon_size: 64

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[percent][total]}%"
      label_alt: "<span>\uf4bc</span> {info[histograms][cpu_percent]}"
      update_interval: 2000

  cpu_temp:
    type: "yasb.libre_monitor.LibreHardwareMonitorWidget"
    options:
      label: "<span>\uf2c9</span> {info[value]}{info[unit]}"
      label_alt: "<span>\uf2c9</span> {info[value]} ({info[min]}/{info[max]}) {info[unit]}"
      sensor_id: "/amdcpu/0/temperature/2"
      update_interval: 2000
      precision: 0
      class_name: "libre-monitor-widget"

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uf2db</span> {virtual_mem_percent}%"
      label_alt: "<span>\uf2db</span> {virtual_mem_free} / {virtual_mem_total}"
      update_interval: 5000

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "{wifi_name} {wifi_strength}%"
      update_interval: 5000

  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "{icon}"
      label_alt: "{icon} {device_name}"

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "{volume}"